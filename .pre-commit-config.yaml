# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Vendored third-party code (bats test helpers) — keep byte-identical to upstream
exclude: ^tests/helpers/
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
            exclude: ^mkdocs\.yml$
          - id: check-added-large-files
          - id: check-executables-have-shebangs
          - id: check-shebang-scripts-are-executable
          - id: detect-private-key
          - id: mixed-line-ending
            args: [--fix=lf]

    - repo: https://github.com/adrienverge/yamllint.git
      rev: v1.37.1
      hooks:
          - id: yamllint

    - repo: https://github.com/AleksaC/hadolint-py
      rev: v2.14.0
      hooks:
          - id: hadolint
            args: ["--ignore", "DL3008", "--ignore", "DL3013"] # Ignore version pinning rules

    - repo: https://github.com/zricethezav/gitleaks
      rev: v8.30.0
      hooks:
          - id: gitleaks

    - repo: https://github.com/python-jsonschema/check-jsonschema
      rev: 0.31.0
      hooks:
          - id: check-jsonschema
            name: Validate pre-flight.yml files
            files: 'pre-flight\.yml$'
            args: ["--schemafile", "schemas/pre-flight.schema.json"]
          - id: check-jsonschema
            alias: check-stack-manifest
            name: Validate x-homelab stack manifests
            files: ^stacks/(apps/)?[^/]+/docker-compose\.yml$
            args: ["--schemafile", "schemas/stack-manifest.schema.json"]

    - repo: local
      hooks:
          - id: shellcheck
            name: ShellCheck
            entry: uv run shellcheck -x --source-path=lib --source-path=tools
            language: system
            # Only the shared shell libraries and tooling; the per-stack scripts under
            # stacks/ have never been checked and are not clean yet.
            files: ^(tools|lib)/.*\.sh$

          - id: ansible-lint
            name: Ansible Lint
            entry: tools/dev/run-ansible-lint.sh
            language: system
            files: \.
            pass_filenames: true

    # Ansible syntax validation
    - repo: local
      hooks:
          - id: ansible-syntax-check
            name: Ansible Syntax Check
            entry: bash -c 'export ANSIBLE_CONFIG=ansible/ansible.cfg; for file in "$@"; do .venv/bin/ansible-playbook --syntax-check "$file" || exit 1; done' --
            language: system
            files: ^ansible/playbooks/.*\.ya?ml$
            exclude: ^ansible/playbooks/.*/tasks/
            pass_filenames: true

          - id: ansible-preflight-unit
            name: Unit tests — preflight role (no cluster required)
            entry: >-
                bash -c 'ANSIBLE_CONFIG=ansible/ansible.cfg
                uv run --frozen ansible-playbook --check
                -i ansible/tests/unit/inventory/
                ansible/tests/unit/test-preflight.yml'
            language: system
            pass_filenames: false
            # Only run when the preflight role, its tests, or a stack manifest it renders changes —
            # not on every commit. --frozen stops uv from rewriting uv.lock during the run.
            files: '^(ansible/roles/preflight/|ansible/tests/unit/|stacks/.*/pre-flight\.yml$)'

          - id: ansible-vault-check
            name: Check for unencrypted Ansible secrets
            entry: >-
                bash -c 'for f in ansible/inventory/group_vars/*.yml; do
                [[ "$f" == *"secrets.yml" ]] && continue;
                if grep -qE "^[^#]*(_token|_password):\s*\"[^{]" "$f" 2>/dev/null; then
                if ! grep -q "lookup\|env\|default" "$f"; then
                echo "ERROR: $f may have unencrypted secrets!"; exit 1;
                fi; fi; done'
            language: system
            pass_filenames: false

          - id: ci-types
            name: Type-check the ci tool (mypy --strict)
            entry: uv run --project tools/ci --with mypy mypy --strict --ignore-missing-imports
            language: system
            # The package only. `--strict` on the suite would demand annotations on
            # every test function, which says nothing about the code under test.
            files: ^tools/ci/ci/.*\.py$
            require_serial: true

          - id: check-stacks
            name: Stack tree invariants (declarations, healthchecks)
            entry: uv run ci check-stacks
            language: system
            pass_filenames: false
            # Whole-tree, every commit: deleting a stack is what dangles an edge,
            # and pre-commit never passes a deleted path to a `files:` hook.
            always_run: true

          - id: no-unconditional-changed-when
            name: No unconditional changed_when in Ansible tasks
            language: pygrep
            entry: 'changed_when:\s*true\s*$'
            # The exclusions are the ratchet: they only ever shrink.
            files: ^ansible/.*\.ya?ml$
            exclude: |
                (?x)^(
                  ansible/collections/|
                  ansible/roles/preflight/tasks/main\.yml$|
                  ansible/tests/integration/test-preflight\.yml$
                )

          - id: no-fixed-duration-pause
            name: No fixed-duration pause in Ansible tasks
            language: pygrep
            # `pause: prompt:` is an interactive gate, not a guessed duration.
            entry: 'pause:\s*\n\s+(seconds|minutes):'
            args: [--multiline]
            # The exclusions are the ratchet: they only ever shrink.
            files: ^ansible/.*\.ya?ml$
            exclude: |
                (?x)^(
                  ansible/collections/|
                  ansible/playbooks/cluster\.yml$|
                  ansible/playbooks/cluster/init\.yml$|
                  ansible/playbooks/cluster/join\.yml$|
                  ansible/playbooks/cluster/sync\.yml$|
                  ansible/playbooks/ops/repair-storage\.yml$|
                  ansible/playbooks/ops/teardown-stack\.yml$|
                  ansible/playbooks/teardown\.yml$|
                  ansible/playbooks/volumes/cleanup\.yml$|
                  ansible/roles/storage/tasks/iscsi-mount\.yml$
                )
