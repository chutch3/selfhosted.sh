# Serves nothing for its first 15s, exactly like a DNS server still loading.
services:
    slow:
        image: alpine:3
        command: ["sh", "-c", "sleep 15; touch /tmp/ready; sleep 600"]
        healthcheck:
            test: ["CMD-SHELL", "test -f /tmp/ready"]
            interval: 2s
            timeout: 2s
            retries: 1
            start_period: 25s
