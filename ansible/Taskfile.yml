version: "3"

vars:
    VENV_ANSIBLE: "uv run ansible"
    VENV_ANSIBLE_PLAYBOOK: "uv run ansible-playbook"
    VENV_ANSIBLE_INVENTORY: "uv run ansible-inventory"

env:
    ANSIBLE_CONFIG: "ansible/ansible.cfg"

tasks:
    # SSH Key Management
    ssh:generate:
        desc: Generate homelab SSH key pair if it does not already exist (reads SSH_KEY_FILE from .env)
        cmds:
            - |
                KEY_FILE="${SSH_KEY_FILE:-$HOME/.ssh/homelab_rsa}"
                KEY_FILE="${KEY_FILE/#\~/$HOME}"
                if [ -f "$KEY_FILE" ]; then
                  echo "SSH key already exists at $KEY_FILE"
                  ssh-keygen -lf "$KEY_FILE"
                else
                  mkdir -p "$(dirname "$KEY_FILE")"
                  ssh-keygen -t rsa -b 4096 -f "$KEY_FILE" -N "" -C "homelab"
                  echo "SSH key generated at $KEY_FILE"
                  echo "Next: task ansible:ssh:distribute"
                fi

    ssh:distribute:
        desc: Push SSH public key to all homelab nodes (runs the ssh role)
        dir: "{{.ROOT_DIR}}"
        preconditions:
            - sh: test -f ansible/inventory/group_vars/all/ssh.yml
              msg: |
                  ansible/inventory/group_vars/all/ssh.yml not found.
                  Copy the example and configure your key path:
                    cp ansible/inventory/group_vars/all/ssh.yml.example ansible/inventory/group_vars/all/ssh.yml
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/ssh.yml {{.CLI_ARGS}}"

    # Ansible Install Ansible (setup)
    install:
        desc: Install Ansible and dependencies
        cmds:
            - uv sync
            - uv run ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

    # Ansible Test connectivity
    ping:
        desc: Test Ansible connectivity to all nodes
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE}} -i ansible/inventory/ all -m ping"

    # Ansible Bootstrap all nodes
    bootstrap:
        desc: Bootstrap all nodes with Ansible
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/bootstrap.yml {{.CLI_ARGS}}"

    # Ansible Bootstrap specific node
    bootstrap:node:
        desc: "Bootstrap specific node (usage: task ansible:bootstrap:node -- worker-01)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/bootstrap.yml --limit {{.CLI_ARGS}}"

    # Ansible Dry run bootstrap
    bootstrap:check:
        desc: Dry run of bootstrap playbook
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/bootstrap.yml --check {{.CLI_ARGS}}"

    # Ansible Validate nodes
    validate:
        desc: Validate all node configurations
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/validate.yml"

    # Ansible Update nodes
    update:
        desc: Update all nodes (packages, configs)
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/update.yml {{.CLI_ARGS}}"

    # Ansible Run specific tags
    tags:
        desc: "Run bootstrap with specific tags (usage: task ansible:tags -- docker,gpu)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/bootstrap.yml --tags {{.CLI_ARGS}}"

    # Ansible Ad-hoc command
    cmd:
        desc: "Run ad-hoc ansible command on all nodes (or HOST=<pattern>). Usage: task ansible:cmd -- -m shell -a 'uptime'"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE}} -i ansible/inventory/ {{ .HOST }} {{.CLI_ARGS}}"
        vars:
            HOST: '{{ .HOST | default "all" }}'

    # Ansible Show inventory
    inventory:
        desc: Show merged inventory (structure + hosts)
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_INVENTORY}} -i ansible/inventory/ --list --yaml"

    # Ansible List hosts
    hosts:
        desc: List all hosts
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE}} -i ansible/inventory/ all --list-hosts"

    # Ansible Cluster Management
    cluster:init:
        desc: "Initialize Docker Swarm on manager node"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/cluster/init.yml {{.CLI_ARGS}}"

    cluster:join:
        desc: "Join worker nodes to the swarm"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/cluster/join.yml {{.CLI_ARGS}}"

    cluster:status:
        desc: Show Docker Swarm cluster status
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/cluster/status.yml {{.CLI_ARGS}}"

    cluster:health:
        desc: "Check cluster health — node states, degraded services, DNS crash history, gossip instability"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - bash tools/cluster-health.sh

    cluster:update-labels:
        desc: Update Docker Swarm node labels from inventory
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/cluster/update-labels.yml {{.CLI_ARGS}}"

    cluster:sync:
        desc: Auto-detect and sync nodes with changed IPs (removes stale entries and rejoins)
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/cluster/sync.yml {{.CLI_ARGS}}"

    ops:repair-network:
        desc: 'Flush stale VXLAN interfaces and repair Swarm networking (usage: task ansible:ops:repair-network -- -e "target_node=mini")'
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/ops/repair-network.yml {{.CLI_ARGS}}"

    # Bringing the cluster up. Deploying stacks onto it is `task deploy`.
    cluster:up:
        desc: "Bring the cluster up: init swarm → join workers → labels → storage → activate nodes"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/cluster.yml {{.CLI_ARGS}}"

    # Ansible Volume Management
    volume:ls:
        desc: List all Docker volumes
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/volumes/list.yml {{.CLI_ARGS}}"

    volume:inspect:
        desc: 'Inspect a specific Docker volume (usage: task ansible:volume:inspect -- -e "service_name=my_app")'
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/volumes/inspect.yml {{.CLI_ARGS}}"

    volume:cleanup:
        desc: 'Clean up stale CIFS volumes for a stack (usage: task ansible:volume:cleanup -- -e "stack_name=sonarr")'
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/volumes/cleanup.yml {{.CLI_ARGS}}"

    volume:fix-nas-ip:
        desc: 'Remove CIFS volumes with old NAS IP (usage: task ansible:volume:fix-nas-ip -- -e "old_nas_ip=192.168.86.189")'
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/volumes/fix-nas-ip.yml {{.CLI_ARGS}}"

    # Ansible DNS Management
    dns:create-zone:
        desc: "[Step 2] Create primary DNS zone in Technitium DNS"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/dns.yml -e \"dns_action=create_zone\" {{.CLI_ARGS}}"

    dns:add-machines:
        desc: "[Step 3] Add machine A records to primary DNS (and secondary if SECONDARY_DNS_ENABLED=true)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/dns.yml -e \"dns_action=add_machine_records\" {{.CLI_ARGS}}"

    dns:add-services:
        desc: "[Step 4] Add CNAME records for all services (and secondary if SECONDARY_DNS_ENABLED=true)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/dns.yml -e \"dns_action=add_service_records\" {{.CLI_ARGS}}"

    dns:configure:
        desc: "[Complete] Full DNS setup - primary + secondary (set SECONDARY_DNS_ENABLED=true to sync Pi-hole)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/dns.yml -e \"dns_action=configure\" {{.CLI_ARGS}}"

    dns:pihole-cleanup:
        desc: "One-off: remove incorrectly added service A records from Pi-hole (run after switching to CNAME approach)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/dns.yml -e \"dns_action=pihole_cleanup_service_arecords\" {{.CLI_ARGS}}"

    configure:dns:
        desc: 'Configure DNS for all services or specific stack (usage: task ansible:configure:dns -- -e "stack_name=kolibri")'
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/dns.yml -e \"dns_action=add_service_records\" {{.CLI_ARGS}}"

    # SNMP Management
    snmp:configure:
        desc: "Install and configure SNMP on all nodes (requires snmpd in packages and snmp.yml)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        preconditions:
            - sh: test -f ansible/inventory/group_vars/all/snmp.yml
              msg: |
                  ansible/inventory/group_vars/all/snmp.yml not found.
                  Copy the example and set your community string:
                    cp ansible/inventory/group_vars/all/snmp.yml.example ansible/inventory/group_vars/all/snmp.yml
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/bootstrap.yml --tags snmp {{.CLI_ARGS}}"

    snmp:configure:node:
        desc: "Configure SNMP on a specific node (usage: task ansible:snmp:configure:node -- worker-01)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        preconditions:
            - sh: test -f ansible/inventory/group_vars/all/snmp.yml
              msg: |
                  ansible/inventory/group_vars/all/snmp.yml not found.
                  Copy the example and set your community string:
                    cp ansible/inventory/group_vars/all/snmp.yml.example ansible/inventory/group_vars/all/snmp.yml
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/bootstrap.yml --tags snmp --limit {{.CLI_ARGS}}"

    # Tailscale VPN Management
    tailscale:configure:
        desc: "Install and configure Tailscale on all nodes (requires TAILSCALE_AUTH_KEY in .env)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/tailscale.yml {{.CLI_ARGS}}"

    tailscale:configure:node:
        desc: "Configure Tailscale on a specific node (usage: task ansible:tailscale:configure:node -- mini)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/tailscale.yml --limit {{.CLI_ARGS}}"

    tailscale:status:
        desc: Show Tailscale status, subnet routes, and health warnings on all nodes
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - |
                SCRIPT='import json,sys; s=json.load(sys.stdin); me=s.get("Self",{}); a=me.get("PrimaryRoutes") or []; p=me.get("AdvertisedRoutes") or []; h=s.get("Health") or []; print("  Active routes  :", ", ".join(a) if a else "none"); print("  Pending routes :", ", ".join(p) if p else "none"); [print("  Health         :", w) for w in h]'
                {{.VENV_ANSIBLE}} --become -i ansible/inventory/ all -m shell \
                  -a "tailscale status && echo && tailscale status --json | python3 -c '$SCRIPT'" \
                  {{.CLI_ARGS}}

    # Ansible Uptime Kuma Management
    uptime:create-groups:
        desc: "Create Machines and Services monitor groups in Uptime Kuma"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/uptime-kuma.yml -e \"uptime_action=create_groups\" {{.CLI_ARGS}}"

    uptime:add-machines:
        desc: "Add ping monitors for all machines"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/uptime-kuma.yml -e \"uptime_action=add_machines\" {{.CLI_ARGS}}"

    uptime:add-services:
        desc: "Add HTTP monitors for all Traefik services (with verification)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/uptime-kuma.yml -e \"uptime_action=add_services\" {{.CLI_ARGS}}"

    uptime:configure:
        desc: "[Complete] Full Uptime Kuma setup (groups + machines + services)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/uptime-kuma.yml -e \"uptime_action=configure\" {{.CLI_ARGS}}"

    configure:uptime:
        desc: 'Configure Uptime Kuma for all services or specific stack (usage: task ansible:configure:uptime -- -e "stack_name=kolibri")'
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/uptime-kuma.yml -e \"uptime_action=add_services\" {{.CLI_ARGS}}"

    # Container Registry Management
    registry:login:
        desc: Login all Swarm nodes to container registry (requires GITHUB_TOKEN and GITHUB_USERNAME)
        dir: "{{.ROOT_DIR}}"
        vars:
            GITHUB_TOKEN: '{{.GITHUB_TOKEN | default ""}}'
            GITHUB_USERNAME: '{{.GITHUB_USERNAME | default ""}}'
        preconditions:
            - sh: '[ -n "{{.GITHUB_TOKEN}}" ]'
              msg: |
                  GITHUB_TOKEN not set. Please set it as environment variable or in .env file:
                    export GITHUB_TOKEN=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    OR add to .env: GITHUB_TOKEN=ghp_xxx
            - sh: '[ -n "{{.GITHUB_USERNAME}}" ]'
              msg: |
                  GITHUB_USERNAME not set. Please set it as environment variable or in .env file:
                    export GITHUB_USERNAME=your-github-username
                    OR add to .env: GITHUB_USERNAME=your-username
        cmds:
            - |
                echo "Logging in to ghcr.io on all nodes as {{.GITHUB_USERNAME}}..."
                {{.VENV_ANSIBLE}} -i ansible/inventory/ all -m shell \
                  -a "for i in 1 2 3; do echo {{.GITHUB_TOKEN}} | docker login ghcr.io -u {{.GITHUB_USERNAME}} --password-stdin && break; echo \"Attempt \$i failed, retrying in 5s...\"; sleep 5; done"

    registry:login:custom:
        desc: "Login to custom registry (set REGISTRY_URL, REGISTRY_USER, REGISTRY_PASS)"
        dir: "{{.ROOT_DIR}}"
        vars:
            REGISTRY_URL: '{{.REGISTRY_URL | default "ghcr.io"}}'
            REGISTRY_USER: '{{.REGISTRY_USER | default ""}}'
            REGISTRY_PASS: '{{.REGISTRY_PASS | default ""}}'
        preconditions:
            - sh: '[ -n "{{.REGISTRY_USER}}" ]'
              msg: |
                  REGISTRY_USER not set. Please set it:
                    export REGISTRY_USER=your-username
                    OR add to .env: REGISTRY_USER=your-username
            - sh: '[ -n "{{.REGISTRY_PASS}}" ]'
              msg: |
                  REGISTRY_PASS not set. Please set it:
                    export REGISTRY_PASS=your-password-or-token
                    OR add to .env: REGISTRY_PASS=your-password
        cmds:
            - |
                echo "Logging in to {{.REGISTRY_URL}} on all nodes as {{.REGISTRY_USER}}..."
                {{.VENV_ANSIBLE}} -i ansible/inventory/ all -m shell \
                  -a "echo {{.REGISTRY_PASS}} | docker login {{.REGISTRY_URL}} -u {{.REGISTRY_USER}} --password-stdin"

    registry:logout:
        desc: Logout from container registry on all nodes (set REGISTRY_URL, defaults to ghcr.io)
        dir: "{{.ROOT_DIR}}"
        vars:
            REGISTRY_URL: '{{.REGISTRY_URL | default "ghcr.io"}}'
        cmds:
            - |
                echo "Logging out from {{.REGISTRY_URL}} on all nodes..."
                {{.VENV_ANSIBLE}} -i ansible/inventory/ all -m shell -a "docker logout {{.REGISTRY_URL}}"

    # Ansible Power Management
    iscsi:login:
        desc: "Login to iSCSI target on all nodes"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/iscsi-login.yml {{.CLI_ARGS}}"

    iscsi:logout:
        desc: "Logout from iSCSI target on all nodes"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/iscsi-logout.yml {{.CLI_ARGS}}"

    iscsi:reconfigure:
        desc: "Reconfigure iSCSI with new portal IP (logout, clean, rediscover, login)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/iscsi-reconfigure.yml {{.CLI_ARGS}}"

    ocfs2:mount:
        desc: "Mount OCFS2 filesystems on all nodes"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/ocfs2-mount.yml {{.CLI_ARGS}}"

    ocfs2:umount:
        desc: "Unmount OCFS2 filesystems on all nodes"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/ocfs2-umount.yml {{.CLI_ARGS}}"

    storage:recover:
        desc: "Recover from OCFS2 journal corruption after a crash or hard reboot: stops all stacks cluster-wide, runs fsck, remounts, redeploys"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/ops/repair-storage.yml {{.CLI_ARGS}}"

    nodes:shutdown:
        desc: "Shut down cluster nodes (usage: task ansible:nodes:shutdown -- <group|all>)"
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/shutdown-nodes.yml --limit {{.CLI_ARGS | default \"all\"}}"

    node:reboot:
        desc: 'Controlled reboot of a healthy cluster node — drains Swarm tasks, unmounts storage, reboots, remounts, redeploys (usage: task ansible:node:reboot -- -e "target_node=mini" -K). Use storage:recover instead if the node crashed or was hard-rebooted.'
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --become -i ansible/inventory/ ansible/playbooks/ops/reboot-node.yml {{.CLI_ARGS}}"

    # ========================================================================
    # TEARDOWN OPERATIONS
    # ========================================================================
    teardown:
        desc: "Full cluster teardown: stacks → containers → networks → storage → leave swarm (preserves volumes)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/teardown.yml -e \"confirm_teardown=true\" {{.CLI_ARGS}}"

    teardown:with-volumes:
        desc: "Full cluster teardown including volume removal (DESTRUCTIVE)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/teardown.yml -e \"confirm_teardown=true remove_volumes=true\" {{.CLI_ARGS}}"

    teardown:services:
        desc: "Remove all Docker Swarm stacks (preserves networks, volumes, swarm membership)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/teardown.yml -e \"confirm_teardown=true\" --tags stacks {{.CLI_ARGS}}"

    teardown:check:
        desc: "Dry run of full teardown (shows what would be removed)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/teardown.yml -e \"confirm_teardown=true\" --check {{.CLI_ARGS}}"

    teardown:service:
        desc: 'Tear down a single stack (usage: task ansible:teardown:service -- -e "stack_name=profilarr remove_volumes=true")'
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/teardown-stack.yml {{.CLI_ARGS}}"

    teardown:stack:
        desc: "Alias for teardown:service"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - task: teardown:service
              vars: {CLI_ARGS: "{{.CLI_ARGS}}"}

    # Docker System Prune Operations
    ops:system-prune:
        desc: Docker system prune on all nodes (dry run by default)
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/system-prune.yml {{.CLI_ARGS}}"

    ops:system-prune:execute:
        desc: Execute docker system prune on all nodes (DESTRUCTIVE - removes all unused data including volumes)
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/system-prune.yml -e \"execute_prune=true\" {{.CLI_ARGS}}"

    ops:system-prune:no-volumes:
        desc: Execute docker system prune on all nodes (preserves volumes)
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/ops/system-prune.yml -e \"execute_prune=true include_volumes=false\" {{.CLI_ARGS}}"

    # ========================================================================
    # SECRET MANAGEMENT (Sync & Restore)
    # ========================================================================
    secrets:login:
        desc: Login and unlock Bitwarden vault (always starts fresh to avoid stale session issues).
        dir: "{{.ROOT_DIR}}"
        interactive: true
        cmds:
            - |
                export PATH="$PATH:$HOME/.local/bin"
                {{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/secrets.yml -e secret_op=install {{.CLI_ARGS}}

                bw logout 2>/dev/null || true
                rm -rf "$HOME/.config/Bitwarden CLI/"
                bw login
                SESSION=$(bw unlock --raw)

                # Verify the captured session actually unlocks the vault before trusting it.
                # bw keeps the vault encrypted at rest, so "unlocked" is a property of THIS
                # session key, not global state — a bare `bw status` always reports "locked".
                STATUS=$(BW_SESSION="$SESSION" bw status 2>/dev/null | uv run python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo 'unknown')
                if [ "$STATUS" = "unlocked" ]; then
                  # Persist only a known-good session so pull/push/compare work afterwards.
                  echo "BW_SESSION=$SESSION" > "$HOME/.bw_session"
                  chmod 600 "$HOME/.bw_session"
                  echo "Vault unlocked. Session saved to ~/.bw_session."
                else
                  echo "Error: vault status is '$STATUS' after unlock. Something went wrong."
                  exit 1
                fi

    secrets:compare:
        desc: Compare local secret files against Bitwarden — shows which keys differ (values masked) and recommends push or pull
        dir: "{{.ROOT_DIR}}"
        cmds:
            - |
                if [ -z "$BW_SESSION" ] && [ -f "$HOME/.bw_session" ]; then set -a; source "$HOME/.bw_session"; set +a; fi
                {{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/secrets.yml -e secret_op=compare {{.CLI_ARGS}}

    secrets:pull:
        desc: Restore .env from the configured secret provider (e.g., Bitwarden)
        dir: "{{.ROOT_DIR}}"
        cmds:
            - |
                if [ -z "$BW_SESSION" ] && [ -f "$HOME/.bw_session" ]; then set -a; source "$HOME/.bw_session"; set +a; fi
                {{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/secrets.yml -e secret_op=pull {{.CLI_ARGS}}

    secrets:push:
        desc: Sync local .env to the configured secret provider (e.g., Bitwarden)
        dir: "{{.ROOT_DIR}}"
        cmds:
            - |
                if [ -z "$BW_SESSION" ] && [ -f "$HOME/.bw_session" ]; then set -a; source "$HOME/.bw_session"; set +a; fi
                {{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/playbooks/secrets.yml -e secret_op=push {{.CLI_ARGS}}

    test:preflight:unit:
        desc: "Unit tests for preflight role — no cluster required (template/logic in --check mode, hook execution with -K for become)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} --check -i ansible/tests/unit/inventory/ ansible/tests/unit/test-preflight.yml {{.CLI_ARGS}}"
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -K -i ansible/tests/unit/hooks-inventory/ ansible/tests/unit/test-preflight-hooks.yml {{.CLI_ARGS}}"

    test:dns:unit:
        desc: "Unit tests for the dns role — no cluster, no Technitium (uses a stub API server)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/tests/unit/dns-inventory/ ansible/tests/unit/test-dns.yml {{.CLI_ARGS}}"

    test:preflight:integration:
        desc: "Integration tests for preflight role — requires running Swarm (creates and cleans up isolated test secrets)"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - "{{.VENV_ANSIBLE_PLAYBOOK}} -i ansible/inventory/ ansible/tests/integration/test-preflight.yml -K {{.CLI_ARGS}}"

    test:deploy:e2e:
        desc: "E2E for the deploy path — needs a running Swarm; deploys fixture stacks under ansible/tests/e2e and removes them"
        dir: "{{.ROOT_DIR}}"
        cmds:
            - HOMELAB_ANSIBLE_E2E=1 bats ansible/tests/e2e/deploy.bats

    test:idempotence:
        desc: "DESTRUCTIVE to the target: run each enrolled playbook twice on THIS machine, requiring changed=0 on the second"
        dir: "{{.ROOT_DIR}}"
        prompt: "This converges the local machine (installs packages, Docker). Only run it on a disposable node."
        vars:
            # Enrolled playbooks. Grows as targets CI can converge become available;
            # anything needing a real cluster is run by hand against one.
            PLAYBOOKS: ansible/playbooks/bootstrap.yml
        # ssh and snmp read group_vars that are gitignored, so they are absent in CI.
        cmds:
            - for: {var: PLAYBOOKS}
              cmd: >-
                  uv run ci idempotence {{.ITEM}}
                  --become -i ansible/inventory/ -i ansible/tests/idempotence/hosts.yml
                  --limit ci-node --skip-tags ssh,snmp {{.CLI_ARGS}}

    secrets:wipe:
        desc: "DESTRUCTIVE: Securely remove local secret files (.env, ansible hosts, ssh config)"
        dir: "{{.ROOT_DIR}}"
        prompt: "Are you sure you want to delete all local secret files? Make sure you have pushed your changes to the vault first!"
        cmds:
            - rm -f .env ansible/inventory/02-hosts.yml ansible/inventory/group_vars/all/ssh.yml ansible/inventory/group_vars/all/snmp.yml
            - echo "Local secret files removed."
