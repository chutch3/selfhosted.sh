# ansible/roles/dns/tasks/adapters/technitium/get-token.yml
---
- name: Authenticate with Technitium DNS API
  ansible.builtin.uri:
    url: "{{ dns_primary_api_url }}/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: "admin"
      pass: "{{ primary_dns_api_key }}"
    status_code: 200
    return_content: yes
  register: dns_auth_response
  delegate_to: localhost
  # A rejected password answers 200 with a body, so only a request that got no
  # answer at all — a server still binding — is retried.
  until: dns_auth_response.json is defined
  retries: "{{ dns_api_retries | default(12) | int }}"
  delay: "{{ dns_api_delay | default(5) | int }}"
  failed_when: false

- name: Fail if authentication failed
  ansible.builtin.fail:
    msg: >-
      Failed to authenticate with Technitium DNS at {{ primary_dns_host }}
      after {{ dns_api_retries | default(12) }} attempts. Response:
      {{ dns_auth_response.json | default(dns_auth_response.msg | default('no response')) }}
  when: not ansible_check_mode and dns_auth_response.json.token is not defined

- name: Set Technitium API token
  ansible.builtin.set_fact:
    dns_api_token: "{{ dns_auth_response.json.token | default('check-mode-token') }}"
